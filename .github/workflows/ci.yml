name: CI & Package Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: npm run test

      - name: Build Production Bundle
        run: npm run build

      - name: Generate NPM Package
        run: |
          npm pack
          mv aiot-simulator-*.tgz aiot-simulator.tgz

      - name: Archive Production Release Bundle
        run: |
          zip -r aiot-simulator-release.zip .next public package.json README.md LICENSE

      - name: Upload NPM Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiot-simulator-npm-package
          path: aiot-simulator.tgz
          retention-days: 30

      - name: Upload Complete Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: aiot-simulator-production-bundle
          path: aiot-simulator-release.zip
          retention-days: 30

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aiot-simulator.tgz
            aiot-simulator-release.zip
          draft: false
          prerelease: false
          generate_release_notes: true
